<!-- The bar every app draws (`@xinutec/ui-scaffold`): the app's name at the root,
     an arrow up and the screen's name below it, from the route. What it holds is
     on every screen. -->
<ui-scaffold [title]="mode() === 'share' ? 'Health (shared)' : 'Health'">
	@if (health.user(); as user) {
		<!-- The name says whose data a shared view shows; on your own it is clutter. -->
		@if (mode() === "share") {
			<span class="user-name">{{ user.displayName }}</span>
		} @else {
			@if (shareUrl(); as url) {
				<button
					mat-icon-button
					type="button"
					(click)="copyShareLink(url)"
					matTooltip="Copy a link to this view"
					aria-label="Copy a link to this view"
					class="share-link">
					<mat-icon>share</mat-icon>
				</button>
			}
			<a mat-icon-button routerLink="/settings" aria-label="Settings" class="settings-link">
				<mat-icon>settings</mat-icon>
			</a>
			<!-- Rare actions behind the overflow menu, out of reach of a mis-tap. -->
			<button mat-icon-button type="button" [matMenuTriggerFor]="more" aria-label="More">
				<mat-icon>more_vert</mat-icon>
			</button>
			<mat-menu #more="matMenu">
				<form method="POST" action="/logout">
					<button mat-menu-item type="submit">
						<mat-icon>logout</mat-icon>
						<span>Log out</span>
					</button>
				</form>
			</mat-menu>
		}
	}
</ui-scaffold>

@if (mode() !== "share") {
	<app-reauth-banner></app-reauth-banner>
}

<main class="content">
	<router-outlet></router-outlet>
</main>

@if (version(); as v) {
	<footer class="version-note">build {{ v }}</footer>
}
