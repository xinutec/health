<mat-card>
  <mat-card-header>
    <mat-card-title>
      <span class="title">
        Heart Rate Awake at Rest
        <button mat-icon-button class="help" aria-label="What this chart shows" (click)="openHelp()">
          <mat-icon>help_outline</mat-icon>
        </button>
      </span>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (failed()) {
      <p class="failed">Could not load this chart.</p>
    } @else {
      <canvas baseChart [data]="chartData()" [options]="chartOptions()" type="line"></canvas>
    }
  </mat-card-content>
</mat-card>
