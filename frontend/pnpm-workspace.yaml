# The FRONTEND's settings. The repo root has its own pnpm-workspace.yaml for the
# backend; the two are separate projects with separate lockfiles, and neither
# declares `packages:` — declaring it would fuse them into one workspace.
#
# pnpm runs a dependency's install script only if it is listed here; npm runs
# them all silently. Keeping that default means the list stays as short as the
# build needs — the first four fetch or compile a platform binary and do not
# work without one.
#
# @xinutec/ui-harness ships TypeScript and builds itself in `prepare`, so pnpm
# must be allowed to run it. The key is the resolved codeload URL rather than
# the package name, because pnpm keys a git dependency by its full spec — so
# this line has to move whenever the harness commit does.
#
# A local install will NOT tell you this entry is missing. The machine-wide
# store already holds the built harness from a sibling repo, so nothing needs
# running and the install passes; CI, with a cold store, fails on
# ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED. Test a change to this file with
# `pnpm install --store-dir <empty dir>`, never a plain install.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  "@xinutec/ui-harness@https://codeload.github.com/xinutec/ui-harness/tar.gz/0350a0577078dc26f40dfdd1c3a6279e7ff95a5c": true

# Carried across from package.json's npm-format `overrides`, which pnpm does not
# read. Leaving them there does not merely ignore them going forward: `pnpm
# import` re-resolves, so the constraint is dropped and a package can land BELOW
# the floor it declares, in a lockfile that looks normal.
overrides:
  undici: ^7.28.0
  esbuild: ^0.28.1
  "@babel/core": ^7.29.6
