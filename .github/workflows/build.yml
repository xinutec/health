---
name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - uses: cachix/install-nix-action@v31
      - run: pnpm install --frozen-lockfile --dir frontend
      - run: pnpm run typecheck:frontend
      - run: pnpm run lint:frontend
      - run: pnpm run lean-check
      - run: pnpm run test:frontend

  # ⚠ NOT `needs: verify`. The image took ~15 min behind a ~5 min verify that
  # repeats what the commit hook and deploy.sh's gate have already run on this
  # tree (lean-check, frontend lint/typecheck/tests). deploy.sh still waits for
  # the WHOLE run, so a red verify still blocks the rollout; what is given up is
  # that `:latest` may be pushed from a tree verify later fails.
  image:
    runs-on: ubuntu-latest
    # Pushes to Docker Hub via DOCKERHUB_* secrets; the GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/health-sync:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=xinutec/health-sync:cache
          # zstd: exporting the cache spent ~4 min gzipping the nix-store
          # layers (2026-09-30); mode=max keeps the frontend and unchanged
          # nix stages reusable, which is what makes dependency-only pushes fast.
          cache-to: type=registry,ref=xinutec/health-sync:cache,mode=max,compression=zstd,compression-level=3
