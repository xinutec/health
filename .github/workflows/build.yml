---
name: build

# health-sync (Node/Hono backend + Angular frontend) — gate the image on `npm
# run verify` (typecheck + schema-drift + biome + angular-eslint + backend and
# frontend unit tests), then build + push xinutec/health-sync:latest to Docker
# Hub. The golden + walk-geometry fixture gates are NOT here: they need the
# gitignored local fixtures and run from scripts/deploy.sh, not CI. The k8s
# manifests + deploy live in the home monorepo (xinutec/pippijn
# code/kubes/health/k8s); the image tag is the only contract with the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Before setup-node, whose `cache: pnpm` shells out to `pnpm store path`.
      # The major floats: pinning it would be a second version held level with
      # the flake's by hand, and the lockfile is what has to match.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      # lean-check (lake build of the verified core — every #guard — plus the
      # TS↔Lean parity harness) runs under `nix develop`, so CI needs nix. The
      # toolchain download comes from cache.nixos.org (flake-pinned; a couple of
      # minutes).
      - uses: cachix/install-nix-action@v31
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir frontend
      # The eight rows of gate.json that a single-repo runner can run, listed
      # rather than chained. NOT `pnpm run verify`: that script runs the gate
      # itself now, and the gate reaches `../dev-lint` — a private sibling
      # repository this checkout does not have. Naming them individually also
      # buys here what the table bought locally: a red run says which of the
      # eight broke, instead of one name for all of them.
      #
      # Missing on purpose, because a runner cannot do them: the artifact-judged
      # `ng build` and the phone-width layout harness (both go through
      # `dev-lint#ng-build`), the shared dev-lint rules, and the gate.json /
      # gate.dhall lockfile check. The 03:00 fleet sweep runs the whole table.
      - run: pnpm run typecheck
      - run: pnpm run typecheck:frontend
      - run: pnpm run check:schema-types
      - run: pnpm run lint
      - run: pnpm run lint:frontend
      # `dist/` before `pnpm test`: tests/golden-bless-flags.test.ts drives the
      # BUILT golden-check CLI, because the bug it guards is in that CLI's own
      # control flow (one process.exit per bless block) and nothing importable
      # can reach it. `typecheck` above is `tsc --noEmit`, so without this step
      # dist/ does not exist here and the spawn fails with a bare exit 1.
      - run: pnpm run build
      # ⚠ `lean-check` BEFORE `pnpm test`, and the order is load-bearing (#975).
      # It runs `lake build`, which is what produces
      # `lean/.lake/build/bin/verified_cli` — and since the TypeScript day
      # cascade was deleted, the fold is the ONLY arm, so any test that drives a
      # day now spawns that binary. Run afterwards, as it used to be, every such
      # test fails with ENOENT on a path that has not been built yet.
      #
      # It cost nothing before because `LEAN_DAY` unset meant the TS arm ran and
      # the binary was never needed here.
      - run: pnpm run lean-check
      - run: pnpm test
      - run: pnpm run test:frontend

  image:
    needs: verify
    runs-on: ubuntu-latest
    # Pushes to Docker Hub via DOCKERHUB_* secrets; the GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/health-sync:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=xinutec/health-sync:cache
          # mode=max persists the builder-stage layers (npm installs, backend build) too.
          cache-to: type=registry,ref=xinutec/health-sync:cache,mode=max
