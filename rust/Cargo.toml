# The in-process host for the Lean day fold (#952).
#
# IN-PROCESS because `PassFold.Env`'s `walkEnv`/`roadEnv` are CALLBACKS the fold
# generates mid-run, and a spawned pure function cannot answer a question it invents
# while running. That is what makes the shells fillable at all.
#
# ⚠ The solvers stay in Lean (`Verified.Geo.Match`, `WalkSmooth`, `WalkEscape`).
# Rust takes only what proof would not help: the process, the lookups, the IO.
[workspace]
members = ["backend", "day-shell"]
resolver = "2"

# ⚠ THE EDITION LIVES HERE, not in the members: a copied manifest then carries
# `edition.workspace = true` and is correct by construction, where a per-crate
# literal is a value a new member gets right only by knowing to look.
[workspace.package]
edition = "2024"

# The test corpus is tens of megabytes of JSON per fixture, parsed several times
# over, so unoptimised serde_json dominates the gate's largest row.
#
# ⚠ `package."*"` EXCLUDES the workspace's own crates: they stay at opt-level 0 so
# a backtrace names a frame and a debugger steps.
[profile.dev.package."*"]
opt-level = 3

# ⚠ Our crates too, because `package."*"` alone is not enough: a generic
# instantiates in the CALLING crate, so `serde_json::from_str::<Value>` is codegen'd
# into `backend` at `backend`'s level. opt-level 1 keeps line tables and stepping.
[profile.dev]
opt-level = 1

# Full debuginfo costs real time to generate and link across backend's lib and its
# test targets. "line-tables-only" keeps file and line numbers in panics and
# backtraces, and drops variable inspection under a live debugger — raise it locally
# for a session if you need that.
debug = "line-tables-only"
