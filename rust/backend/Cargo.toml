[package]
name = "backend"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# The house sqlx line (#982), matching the sibling repos exactly.
#
# ⚠ RUNTIME QUERIES ONLY — `sqlx::query(…)` / `query_as(…)`, never the checked
# `query!` macros: those need a live database or a committed `.sqlx` cache at
# COMPILE time, and no repo here has one. `macros` is present only to match.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "chrono",
    "json",
    "derive",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# The fleet's HTTP stack, matching the sibling repos. `fs` because this serves the
# built Angular app from ./public alongside the API.
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
# Session cookies (#982), already in the lockfile via sqlx.
# ⚠ `hmac` 0.13 pairs with `sha2` 0.11 because both are on `digest` 0.11; a `sha2`
# 0.10 here would silently fail to satisfy it.
#
# These are the only part of auth not in Lean — the rules around them (framing,
# expiry, what a share viewer may do) are `Verified.Session`.
hmac = "0.13"
sha2 = "0.11"
# Constant-time comparison. A signature check that returns early on the first
# differing byte leaks where it differed, one request at a time.
subtle = "2"
base64 = "0.23"
# `getrandom` rather than `rand`: the OS entropy source and nothing else — no
# seeding, no distributions, no generator to get wrong.
getrandom = "0.4"
tower = { version = "0.5", features = ["util"] }
# ⚠ `compression-*` IS LOAD-BEARING, not a nicety. Without it every API response
# goes out as raw JSON — `/api/heartrate/intraday` for ONE day is megabytes, and
# most of it is `user_id` and `tz` repeated verbatim per row. That is exactly what
# a stream compressor removes, and what a schema change could only fix by breaking
# the API.
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "compression-gzip",
    "compression-br",
] }
serde = { version = "1", features = ["derive"] }
# ⚠ BOTH FEATURES ARE LOAD-BEARING for the day fold's wire format, which exists to
# carry the exact double (src/fold_payload.rs).
#
# float_roundtrip: without it `Value::as_f64` disagrees with V8 by one ULP on some
# decimals, so the verified core is asked a different question than the TypeScript
# asked.
#
# preserve_order: the answer tables are emitted by iterating a JSON object, and
# JavaScript iterates in INSERTION order where serde_json's default Map is sorted.
# Lean builds a HashMap and does not care; the comparison against the TypeScript
# does, and a diff that is really a sort hides a diff that is not.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bounded outbound calls (Nextcloud, Fitbit). rustls to match the sqlx TLS
# choice above rather than dragging in a second TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",   # `.form()` and
    "query",  # `.query()` are features in 0.13
    "rustls", # 0.13's name for rustls-tls
] }
# Errors that carry WHICH env var was missing rather than a bare `None`. The
# whole value of the config layer is refusing to start with a specific reason.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA zone database. Fitbit sends a wall clock with no offset, so turning
# one into an instant needs real zone data. Version matches the fleet.
chrono-tz = "0.10"
# Timezone POLYGONS — which IANA zone a latitude/longitude falls in. Distinct
# from chrono-tz above, which answers what a zone's offset is once you know its
# name; nothing in the zone database can tell you the name from a coordinate.
#
# ⚠ THIS IS A DIFFERENT DATASET FROM THE `tz-lookup` NPM PACKAGE THE TYPESCRIPT
# USED, and the two can disagree near a zone border. That is a real behaviour
# difference in a port, not a detail: the answer is written into a `tz` column
# and never revisited. It is accepted rather than overlooked because there is no
# Rust binding to tz-lookup's dataset, and because tzf's polygons are the more
# accurate of the two — tz-lookup ships a deliberately coarsened approximation.
# `bundled` embeds the compressed polygons so the image needs no data file.
tzf-rs = { version = "1.3.7", default-features = false, features = ["bundled"] }
# Held, not used directly: tzf-rs 1.3.7 compiles against tzf-dist's
# `0.0.2026-c` data crate and its requirement admits `0.0.2026-d`, which
# dropped `load_preindex` and `load_topology_compress_topo` — so a plain
# `cargo update` breaks the build. A direct `=` pin is what cargo unifies the
# transitive range with; lift it when tzf-rs releases against `-d`.
tzf-dist = "=0.0.2026-c-fix1"

[lints]
workspace = true
