[package]
name = "backend"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# For the converge loop: the fold reports unanswered keys by panicking to
# stderr, so a host has to capture fd 2 around the call. A temporary FILE, not a
# pipe — see lean::serve_capturing_misses.
tempfile = "3"
libc = "0.2"
# ⚠ LINKED FOR ITS SYMBOLS, not for its API. `day-shell`'s `osm` module defines
# the `#[unsafe(no_mangle)]` entry points that `DayEntry.OsmHost`'s `@[extern]`
# lookups resolve against, and this binary links `ServeEntry`, which imports
# `DayEntry`. Without it the link falls back to nothing — or worse, to
# `c/osm-host-stub.c`, which answers every lookup with zero polylines and so
# decodes a day with no map while reporting success.
day-shell = { path = "../day-shell" }
# The house sqlx line (#982): crate, version and FULL feature list matching
# `tasks`, `messages`, `life`, `coach`, `fleetwatch` and `signal`. `day-shell`
# deliberately took a subset because it is a Lean host with two reads; this is
# the backend those repos are siblings of, so it matches them exactly.
#
# ⚠ RUNTIME QUERIES ONLY — `sqlx::query(…)` / `query_as(…)`, never the checked
# `query!` macros. The `macros` feature is present because the siblings carry
# it, not as licence to use it: the checked forms need a live database or a
# committed `.sqlx` cache at COMPILE time, and no repo here has one. Reaching
# for `query!` breaks the image build for a benefit nothing else here takes.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "chrono",
    "json",
    "derive",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# The fleet's HTTP stack, matching the ten sibling repos that serve: axum 0.8,
# axum-extra 0.12 for cookies, tower-http 0.7 for static files and tracing.
# Health's TypeScript serves the built Angular app from ./public alongside the
# API, so `fs` is not optional here.
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
# Session cookies (#982). Every one of these is ALREADY in the lockfile via
# sqlx, so declaring them adds no resolution — the versions below are the ones
# already resolved, and `hmac` 0.13 pairs with `sha2` 0.11 because both are on
# `digest` 0.11. Pinning a `sha2` 0.10 here would silently fail to satisfy it.
#
# ⚠ These are the ONLY part of auth that is not in Lean, and that is the split
# `lib.rs` describes: there is nothing to prove about an HMAC beyond that it was
# asked for. The rules around them — the framing, the expiry boundary, what a
# share viewer may do — are `Verified.Session`.
hmac = "0.13"
sha2 = "0.11"
# Constant-time comparison. A signature check that returns early on the first
# differing byte leaks where it differed, one request at a time.
subtle = "2.6"
base64 = "0.22"
# The CSPRNG behind a session id. `getrandom` rather than `rand`: this wants the
# OS entropy source and nothing else — no seeding, no distributions, no
# generator to get wrong.
getrandom = "0.4"
tower = { version = "0.5", features = ["util"] }
# ⚠ `compression-*` IS LOAD-BEARING, not a nicety. Without it every API
# response goes out as raw JSON: measured 2026-08-30 in production,
# `/api/heartrate/intraday` for a single half-finished day was 2,556,228 bytes
# with `encodedBodySize == decodedBodySize`, i.e. no encoding at all. The rows
# repeat `user_id` and `tz` verbatim 18,656 times, so the body is mostly one
# constant — exactly what a stream compressor removes and a schema change would
# take an API break to fix.
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "compression-gzip",
    "compression-br",
] }
serde = { version = "1", features = ["derive"] }
# ⚠ float_roundtrip IS LOAD-BEARING, not a tuning knob. Without it
# `Value::as_f64` disagrees with V8 by one ULP on some decimals —
# 1.3051391499999703 parses to ...425 here and ...424 in Node, Python and
# Rust's own str::parse. The day fold's wire format exists to carry the exact
# double (see src/fold_payload.rs), so an off-by-one-ULP parse asks the verified
# core a different question than the TypeScript asked.
# ⚠ BOTH FEATURES ARE LOAD-BEARING for the day fold's wire format.
#
# float_roundtrip: without it `Value::as_f64` disagrees with V8 by one ULP on
# some decimals — 1.3051391499999703 parses to ...425 here and ...424 in Node,
# Python and Rust's own str::parse.
#
# preserve_order: the answer tables are emitted by iterating a JSON object, and
# JavaScript iterates in INSERTION order while serde_json's default Map is
# sorted. Lean builds a HashMap from them so it does not care — but the
# comparison against the TypeScript does, and a diff that is really just a sort
# hides a diff that is not.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bounded outbound calls (Nextcloud, Fitbit). rustls to match the sqlx TLS
# choice above rather than dragging in a second TLS stack.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Errors that carry WHICH env var was missing rather than a bare `None`. The
# whole value of the config layer is refusing to start with a specific reason.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA zone database. Fitbit sends a wall clock with no offset, so turning
# one into an instant needs real zone data. Version matches the fleet.
chrono-tz = "0.10"
# Timezone POLYGONS — which IANA zone a latitude/longitude falls in. Distinct
# from chrono-tz above, which answers what a zone's offset is once you know its
# name; nothing in the zone database can tell you the name from a coordinate.
#
# ⚠ THIS IS A DIFFERENT DATASET FROM THE `tz-lookup` NPM PACKAGE THE TYPESCRIPT
# USED, and the two can disagree near a zone border. That is a real behaviour
# difference in a port, not a detail: the answer is written into a `tz` column
# and never revisited. It is accepted rather than overlooked because there is no
# Rust binding to tz-lookup's dataset, and because tzf's polygons are the more
# accurate of the two — tz-lookup ships a deliberately coarsened approximation.
# `bundled` embeds the compressed polygons so the image needs no data file.
tzf-rs = { version = "1.3.7", default-features = false, features = ["bundled"] }

[build-dependencies]
# Compiles src/shim.c, which is how Rust reaches the  half of
# Lean's runtime interface. Same reason and same version as day-shell.
cc = "1"
